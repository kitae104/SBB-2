<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<div layout:fragment="content" class="container my-3">
  <!-- 1. 질문 영역 (Card 레이아웃) -->
  <h2 class="border-bottom py-2" th:text="${question.subject}">제목</h2>
  <div class="card my-3">
    <div class="card-body">
      <!-- 질문 내용 -->
      <div class="card-text" style="white-space: pre-line;" th:text="${question.content}">내용</div>

      <!-- 작성자 / 작성일시 영역 (추후 데이터 바인딩을 위한 틀) -->
      <div class="d-flex justify-content-end">
        <div class="badge bg-light text-dark p-2 text-start">
          <div class="mb-2">작성자 정보</div>
          <div>2026-00-00 00:00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 답변 개수 표시 -->
  <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>

  <!-- 3. 답변 목록 영역 (반복 출력) -->
  <div class="card my-3" th:each="answer : ${question.answerList}">
    <div class="card-body">
      <!-- 답변 내용 -->
      <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}">답변 내용</div>

      <!-- 답변 작성자 / 작성일시 영역 -->
      <div class="d-flex justify-content-end">
        <div class="badge bg-light text-dark p-2 text-start">
          <div class="mb-2">답변자 정보</div>
          <div>2026-00-00 00:00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 답변 등록 폼 영역 -->
  <form th:action="@{/answer/create/{id}(id=${question.id})}" method="post" class="my-3">
    <div class="mb-3">
      <label for="content" class="form-label fw-bold">답변 작성</label>
      <textarea name="content" id="content" rows="7" class="form-control" placeholder="답변을 입력하세요."></textarea>
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary my-2">답변 등록</button>
    </div>
  </form>
</div>
</html>
